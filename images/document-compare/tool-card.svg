<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="752" viewBox="0 0 2048 752" role="img" aria-label="公式ツール一覧でドキュメントレビューを選択する画面">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#eef1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1f2355" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="2048" height="752" fill="#f7f7fa"/>
  <rect width="322" height="752" fill="#fff"/>
  <line x1="322" y1="0" x2="322" y2="752" stroke="#e5e7ef"/>

  <rect x="14" y="24" width="291" height="46" rx="8" fill="#4361ff"/>
  <text x="73" y="53" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">＋ エージェントの作成</text>

  <text x="20" y="112" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6e7390">ビジネス</text>
  <text x="20" y="151" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">✧  エージェントを探す</text>
  <text x="20" y="197" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">▣  マイエージェント</text>

  <text x="20" y="250" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6e7390">リソース</text>
  <text x="20" y="292" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">▭  ナレッジベース</text>
  <text x="20" y="338" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">◎  データベース</text>
  <rect x="4" y="358" width="304" height="42" rx="8" fill="#eceffd"/>
  <text x="21" y="386" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#3f63ff">⚒  ツール</text>
  <text x="20" y="432" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">♘  MCP管理</text>
  <text x="20" y="482" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">▣  スキル管理</text>

  <text x="20" y="534" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6e7390">評価</text>
  <text x="20" y="574" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">◷  ダッシュボード</text>
  <text x="20" y="624" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#11142d">⚑  評価⌄</text>

  <rect x="347" y="-3" width="1694" height="158" rx="0" fill="url(#hero)"/>
  <text x="406" y="57" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#171447">エージェントの能力を最大化するツールを作成</text>
  <text x="407" y="104" font-family="Inter, Arial, sans-serif" font-size="21" fill="#777b99">エージェントで利用するAPI連携を設定</text>
  <rect x="1810" y="-1" width="220" height="51" rx="9" fill="#dcd6ff"/>
  <text x="1841" y="31" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#4462ff">＋ カスタムツール</text>

  <text x="347" y="237" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#171447">公式ツール</text>

  <rect x="347" y="287" width="420" height="238" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="373" y="323" width="51" height="51" rx="8" fill="#9257f6"/>
  <text x="396" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff">▣</text>
  <text x="439" y="356" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#171447">ウェブスクレイピング</text>
  <text x="374" y="421" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a0a5bd">ウェブサイトから重要な情報を定期的に取得</text>
  <text x="374" y="454" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a0a5bd">し、ナレッジベースに保存</text>

  <rect x="787" y="287" width="420" height="238" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="813" y="323" width="51" height="51" rx="8" fill="#4361ff"/>
  <text x="839" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">▣</text>
  <text x="879" y="356" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#171447">ドキュメントレビュー</text>
  <text x="813" y="421" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a0a5bd">個別のドキュメントに対してクエリを実行、</text>
  <text x="813" y="454" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a0a5bd">複数のドキュメントが指定された条件を満た</text>
  <text x="813" y="487" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a0a5bd">しているか確認</text>
  <rect x="771" y="265" width="496" height="278" rx="4" fill="none" stroke="#ff4d4f" stroke-width="5"/>

  <text x="347" y="635" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#171447">カスタムツール</text>
  <text x="348" y="719" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#4462ff">自分が作成したもの</text>
  <line x1="446" y1="738" x2="496" y2="738" stroke="#4462ff" stroke-width="4"/>
  <text x="637" y="719" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#171447">利用権限が付きされたもの</text>
  <rect x="1770" y="598" width="258" height="50" rx="9" fill="#fff"/>
  <text x="1785" y="630" font-family="Inter, Arial, sans-serif" font-size="20" fill="#b2b6c7">検索</text>
</svg>
